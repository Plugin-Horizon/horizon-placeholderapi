[package]
name = "mod-placeholderapi"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
# The local time for %server_time_...%; arismoko's Cargo.lock has chrono 0.4.45.
chrono = "0.4"
